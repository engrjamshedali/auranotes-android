  <text x="24" y="486" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">SPACES</text>
  <rect x="28" y="498" width="30" height="30" rx="9" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
