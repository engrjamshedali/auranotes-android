  <rect x="28" y="538" width="30" height="30" rx="9" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <circle cx="43" cy="553" r="5" fill="#3B82F6"/>
  <text x="68" y="558" fill="#1D2433" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Programming</text>

  <rect x="28" y="578" width="30" height="30" rx="9" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <circle cx="43" cy="593" r="5" fill="#10B981"/>
  <text x="68" y="598" fill="#1D2433" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Projects</text>

  <!-- Category: BACKUP & STORAGE -->
