  <rect x="28" y="390" width="30" height="30" rx="9" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <text x="36" y="409" fill="#3B82F6" font-family="monospace" font-size="10" font-weight="700">&lt;/&gt;</text>
  <text x="68" y="410" fill="#1D2433" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Code Studio</text>

  <rect x="28" y="430" width="30" height="30" rx="9" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <text x="68" y="450" fill="#1D2433" font-family="system-ui, sans-serif" font-size="13" font-weight="500">New Python Script</text>

