  <rect x="28" y="648" width="30" height="30" rx="9" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <path d="M38 666h10m-5 0v-6m-3 3l3-3 3 3" stroke="#3B82F6" stroke-width="1.6" stroke-linecap="round"/>
  <text x="68" y="668" fill="#1D2433" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Backup &amp; Restore</text>

  <!-- Category: PREFERENCES -->
  <text x="24" y="706" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">PREFERENCES</text>
  <rect x="28" y="716" width="30" height="28" rx="9" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <text x="68" y="734" fill="#1D2433" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Settings &amp; Theme</text>
