  <path d="M35 50l7-11 7 11-7 4z" fill="#FFFFFF"/>
  <text x="76" y="46" fill="#1D2433" font-family="system-ui, sans-serif" font-size="16" font-weight="700">AuraNotes</text>
  <rect x="160" y="34" width="32" height="16" rx="7" fill="#E1E8F2"/>
  <text x="166" y="45" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">v2.0</text>
  <text x="76" y="63" fill="#5A6780" font-family="system-ui, sans-serif" font-size="11">Cloud &amp; Local Vault</text>

  <rect x="242" y="32" width="36" height="36" rx="11" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <path d="M255 45l10 10M265 45l-10 10" stroke="#5A6780" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Live Google Profile Card -->
  <rect x="20" y="88" width="258" height="58" rx="18" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <circle cx="48" cy="117" r="17" fill="#3B82F6"/>
  <text x="48" y="122" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700">JA</text>
  <text x="74" y="112" fill="#1D2433" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Jamshed Ali</text>
  <text x="74" y="128" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10">engr.jamshed.ali@gmail.com</text>
  <circle cx="262" cy="117" r="4.5" fill="#22C55E"/>

  <line x1="20" y1="160" x2="278" y2="160" stroke="#D6DFEC" stroke-width="1"/>

  <!-- Category: MAIN -->
  <text x="24" y="182" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.8">MAIN</text>

  <!-- Active Row: Library -->
  <rect x="20" y="192" width="258" height="42" rx="14" fill="#E1E8F2" stroke="#3B82F6" stroke-opacity="0.28"/>
  <rect x="28" y="198" width="30" height="30" rx="9" fill="#3B82F6"/>
  <rect x="37" y="207" width="12" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
  <text x="68" y="218" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Library</text>
