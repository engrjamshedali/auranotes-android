  <text x="16" y="278" fill="#484F58" font-family="monospace" font-size="12">  7</text>
  <text x="16" y="300" fill="#484F58" font-family="monospace" font-size="12">  8</text>
  <text x="16" y="322" fill="#484F58" font-family="monospace" font-size="12">  9</text>
  <text x="16" y="344" fill="#484F58" font-family="monospace" font-size="12"> 10</text>
  <text x="16" y="366" fill="#484F58" font-family="monospace" font-size="12"> 11</text>
  <text x="16" y="388" fill="#484F58" font-family="monospace" font-size="12"> 12</text>

  <!-- Highlighted Code Lines -->
  <text x="56" y="146" fill="#8B949E" font-family="monospace" font-size="12"># Real Offline Python Scripting</text>
  <text x="56" y="168" fill="#FF7B72" font-family="monospace" font-size="12">def <tspan fill="#D2A8FF">calculate_aura_metrics</tspan><tspan fill="#F8FAFC">():</tspan></text>
  <text x="56" y="190" fill="#D2A8FF" font-family="monospace" font-size="12">    print<tspan fill="#F8FAFC">(</tspan><tspan fill="#A5D6FF">"=== AuraNotes Engine ==="</tspan><tspan fill="#F8FAFC">)</tspan></text>
  <text x="56" y="212" fill="#F8FAFC" font-family="monospace" font-size="12">    scores = [x**<tspan fill="#79C0FF">2</tspan> <tspan fill="#FF7B72">for</tspan> x <tspan fill="#FF7B72">in</tspan> <tspan fill="#D2A8FF">range</tspan>(<tspan fill="#79C0FF">1</tspan>, <tspan fill="#79C0FF">8</tspan>)]</text>
  <text x="56" y="234" fill="#D2A8FF" font-family="monospace" font-size="12">    print<tspan fill="#F8FAFC">(</tspan><tspan fill="#A5D6FF">"Matrix:"</tspan><tspan fill="#F8FAFC">, scores)</tspan></text>
  <text x="56" y="256" fill="#F8FAFC" font-family="monospace" font-size="12">    total = <tspan fill="#D2A8FF">sum</tspan>(scores)</text>
  <text x="56" y="278" fill="#F8FAFC" font-family="monospace" font-size="12">    avg = total / <tspan fill="#D2A8FF">len</tspan>(scores)</text>
  <text x="56" y="300" fill="#D2A8FF" font-family="monospace" font-size="12">    print<tspan fill="#F8FAFC">(</tspan><tspan fill="#A5D6FF">"Total Sum:"</tspan><tspan fill="#F8FAFC">, total)</tspan></text>
  <text x="56" y="322" fill="#D2A8FF" font-family="monospace" font-size="12">    print<tspan fill="#F8FAFC">(</tspan><tspan fill="#A5D6FF">"Mean Score:"</tspan><tspan fill="#F8FAFC">, avg)</tspan></text>
  <text x="56" y="344" fill="#FF7B72" font-family="monospace" font-size="12">    return <tspan fill="#F8FAFC">total</tspan></text>
  <text x="56" y="388" fill="#F8FAFC" font-family="monospace" font-size="12">calculate_aura_metrics()</text>

