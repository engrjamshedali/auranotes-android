  <text x="72" y="53" fill="#1D2433" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Code Studio</text>
  <text x="72" y="69" fill="#22C55E" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Saved locally · PYTHON</text>

  <rect x="236" y="36" width="66" height="36" rx="12" fill="#E1E8F2"/>
  <text x="269" y="58" fill="#3B82F6" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700">PY ▾</text>

  <circle cx="338" cy="54" r="19" fill="#3B82F6"/>
  <polygon points="334,47 334,61 346,54" fill="#FFFFFF"/>

  <!-- High-Contrast Dark Syntax Canvas -->
