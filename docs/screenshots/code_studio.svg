  <line x1="56" y1="92" x2="56" y2="432" stroke="#232B3E" stroke-width="1"/>

  <text x="26" y="122" fill="#596782" font-family="monospace" font-size="11.5"> 1</text>
  <text x="26" y="144" fill="#596782" font-family="monospace" font-size="11.5"> 2</text>
  <text x="26" y="166" fill="#596782" font-family="monospace" font-size="11.5"> 3</text>
  <text x="26" y="188" fill="#596782" font-family="monospace" font-size="11.5"> 4</text>
  <text x="26" y="210" fill="#596782" font-family="monospace" font-size="11.5"> 5</text>
  <text x="26" y="232" fill="#596782" font-family="monospace" font-size="11.5"> 6</text>
  <text x="26" y="254" fill="#596782" font-family="monospace" font-size="11.5"> 7</text>
  <text x="26" y="276" fill="#596782" font-family="monospace" font-size="11.5"> 8</text>
  <text x="26" y="298" fill="#596782" font-family="monospace" font-size="11.5"> 9</text>
  <text x="26" y="320" fill="#596782" font-family="monospace" font-size="11.5">10</text>

  <text x="68" y="122" fill="#8B949E" font-family="monospace" font-size="11.5"># Real Offline Python Execution</text>
  <text x="68" y="144" fill="#FF7B72" font-family="monospace" font-size="11.5">def <tspan fill="#D2A8FF">calculate_aura_metrics</tspan><tspan fill="#F1F5FB">():</tspan></text>
  <text x="68" y="166" fill="#D2A8FF" font-family="monospace" font-size="11.5">    print<tspan fill="#F1F5FB">(</tspan><tspan fill="#A5D6FF">"=== AuraNotes ==="</tspan><tspan fill="#F1F5FB">)</tspan></text>
  <text x="68" y="188" fill="#F1F5FB" font-family="monospace" font-size="11.5">    scores = [x**<tspan fill="#79C0FF">2</tspan> <tspan fill="#FF7B72">for</tspan> x <tspan fill="#FF7B72">in</tspan> <tspan fill="#D2A8FF">range</tspan>(<tspan fill="#79C0FF">1</tspan>, <tspan fill="#79C0FF">8</tspan>)]</text>
  <text x="68" y="210" fill="#D2A8FF" font-family="monospace" font-size="11.5">    print<tspan fill="#F1F5FB">(</tspan><tspan fill="#A5D6FF">"Matrix:"</tspan><tspan fill="#F1F5FB">, scores)</tspan></text>
  <text x="68" y="232" fill="#F1F5FB" font-family="monospace" font-size="11.5">    total = <tspan fill="#D2A8FF">sum</tspan>(scores)</text>
  <text x="68" y="254" fill="#F1F5FB" font-family="monospace" font-size="11.5">    avg = total / <tspan fill="#D2A8FF">len</tspan>(scores)</text>
  <text x="68" y="276" fill="#D2A8FF" font-family="monospace" font-size="11.5">    print<tspan fill="#F1F5FB">(</tspan><tspan fill="#A5D6FF">"Sum:"</tspan><tspan fill="#F1F5FB">, total, <tspan fill="#A5D6FF">"Avg:"</tspan>, avg)</tspan></text>
  <text x="68" y="320" fill="#F1F5FB" font-family="monospace" font-size="11.5">calculate_aura_metrics()</text>

  <!-- Live Output Console Card -->
  <rect x="16" y="446" width="348" height="196" rx="20" fill="#181C27"/>
  <text x="34" y="476" fill="#F1F5FB" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Execution Output</text>
  <rect x="158" y="460" width="96" height="22" rx="8" fill="#1E293B"/>
  <text x="206" y="475" fill="#22C55E" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700">SUCCESS · 8ms</text>
  <line x1="34" y1="490" x2="346" y2="490" stroke="#293041"/>

  <text x="34" y="514" fill="#A5D6FF" font-family="monospace" font-size="11.5">=== AuraNotes ===</text>
  <text x="34" y="536" fill="#A5D6FF" font-family="monospace" font-size="11.5">Matrix: [1, 4, 9, 16, 25, 36, 49]</text>
  <text x="34" y="558" fill="#A5D6FF" font-family="monospace" font-size="11.5">Sum: 140 Avg: 20.0</text>
  <text x="34" y="590" fill="#22C55E" font-family="monospace" font-size="11">Offline Python / Web / SQLite Ready</text>

