<svg xmlns="http://www.w3.org/2000/svg" width="380" height="760" viewBox="0 0 380 760">
  <defs>
    <linearGradient id="bgBackup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0E1525"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="380" height="760" rx="28" fill="url(#bgBackup)" stroke="#23324F" stroke-width="3"/>

  <!-- Status Bar -->
  <text x="26" y="28" fill="#94A3B8" font-family="sans-serif" font-size="12" font-weight="bold">11:38</text>
  <circle cx="330" cy="24" r="5" fill="#10B981"/>
  <rect x="342" y="19" width="18" height="10" rx="2" fill="#94A3B8"/>

  <!-- Header -->
  <text x="24" y="66" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="bold">Backup &amp; Migration</text>
  <text x="24" y="86" fill="#94A3B8" font-family="sans-serif" font-size="11">Zero cloud required · Portable .auranotes packages</text>

  <!-- Main Backup Card -->
  <rect x="20" y="104" width="340" height="206" rx="16" fill="#141D33" stroke="#23324F" stroke-width="1.5"/>
  <text x="36" y="132" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">☁️  AuraNotes Portable Backup</text>
  <text x="36" y="156" fill="#94A3B8" font-family="sans-serif" font-size="12">Export your complete database, notes, rich-text,</text>
  <text x="36" y="174" fill="#94A3B8" font-family="sans-serif" font-size="12">categories, and media vault into a verified</text>
  <text x="36" y="192" fill="#94A3B8" font-family="sans-serif" font-size="12">.auranotes ZIP archive with SHA-256 checksums.</text>

  <!-- Create & Restore Buttons -->
  <rect x="36" y="208" width="148" height="38" rx="12" fill="url(#btnGrad)"/>
  <text x="58" y="232" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="bold">↑ Create Backup</text>

  <rect x="196" y="208" width="148" height="38" rx="12" fill="#1E1B4B" stroke="#6366F1"/>
  <text x="216" y="232" fill="#818CF8" font-family="sans-serif" font-size="12" font-weight="bold">↓ Restore Backup</text>

  <!-- Export Ready Banner -->
  <rect x="36" y="256" width="308" height="40" rx="10" fill="#1E1B4B"/>
  <text x="48" y="274" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">✓ AuraNotes_Backup_20261022.auranotes</text>
  <text x="48" y="289" fill="#818CF8" font-family="sans-serif" font-size="10">SHA-256 Verified · Ready to Share</text>

  <!-- Scheduler Card -->
  <rect x="20" y="324" width="340" height="120" rx="16" fill="#141D33" stroke="#23324F" stroke-width="1.5"/>
  <text x="36" y="352" fill="#F8FAFC" font-family="sans-serif" font-size="15" font-weight="bold">🕒  Automatic Backup Scheduler</text>
  <text x="36" y="374" fill="#94A3B8" font-family="sans-serif" font-size="11">Periodic snapshots kept safe in local storage.</text>

  <rect x="36" y="392" width="72" height="30" rx="8" fill="#6366F1"/>
  <text x="48" y="411" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="bold">WEEKLY</text>

  <rect x="116" y="392" width="64" height="30" rx="8" fill="#101726" stroke="#23324F"/>
  <text x="131" y="411" fill="#94A3B8" font-family="sans-serif" font-size="11">DAILY</text>

  <rect x="188" y="392" width="80" height="30" rx="8" fill="#101726" stroke="#23324F"/>
  <text x="200" y="411" fill="#94A3B8" font-family="sans-serif" font-size="11">MONTHLY</text>

  <rect x="276" y="392" width="54" height="30" rx="8" fill="#101726" stroke="#23324F"/>
  <text x="292" y="411" fill="#94A3B8" font-family="sans-serif" font-size="11">OFF</text>

  <!-- Restore Wizard Preview Card -->
  <rect x="20" y="458" width="340" height="214" rx="16" fill="#101726" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="36" y="484" fill="#38BDF8" font-family="sans-serif" font-size="14" font-weight="bold">🛡️ Restore Wizard &amp; Conflict Resolution</text>
  <text x="36" y="506" fill="#F8FAFC" font-family="sans-serif" font-size="11">Package: AuraNotes v1.0 · 4 Notes · 9 Categories</text>
  <line x1="36" y1="518" x2="344" y2="518" stroke="#23324F"/>

  <circle cx="46" cy="540" r="6" fill="#6366F1"/>
  <text x="62" y="544" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="bold">Merge (Recommended)</text>
  <text x="62" y="560" fill="#94A3B8" font-family="sans-serif" font-size="10">Keep existing notes, add new ones safely</text>

  <circle cx="46" cy="584" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="62" y="588" fill="#F8FAFC" font-family="sans-serif" font-size="12">Keep Both (Generate New UUIDs)</text>

  <circle cx="46" cy="618" r="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="62" y="622" fill="#F8FAFC" font-family="sans-serif" font-size="12">Clean Replace (Auto Pre-Restore Snapshot)</text>

  <!-- Bottom Navigation Bar -->
  <rect x="4" y="690" width="372" height="66" rx="20" fill="#101726"/>
  <text x="43" y="744" fill="#94A3B8" font-family="sans-serif" font-size="11">Notes</text>
  <text x="135" y="744" fill="#94A3B8" font-family="sans-serif" font-size="11">Vault</text>
  <rect x="206" y="700" width="68" height="28" rx="14" fill="#1E1B4B"/>
  <text x="218" y="744" fill="#818CF8" font-family="sans-serif" font-size="11" font-weight="bold">Backups</text>
  <text x="305" y="744" fill="#94A3B8" font-family="sans-serif" font-size="11">Settings</text>
</svg>
