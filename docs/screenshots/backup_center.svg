<svg xmlns="http://www.w3.org/2000/svg" width="380" height="760" viewBox="0 0 380 760">
  <defs>
    <filter id="neuRaised" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#C3CDD9" flood-opacity="0.75"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
    <filter id="neuRaisedSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="4" flood-color="#C3CDD9" flood-opacity="0.7"/>
      <feDropShadow dx="-2.5" dy="-2.5" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
  </defs>

  <rect width="380" height="760" rx="30" fill="#EAEFF6" stroke="#D6DFEC" stroke-width="2.5"/>

  <!-- Header -->
  <rect x="20" y="34" width="42" height="42" rx="13" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <path d="M32 49h18M32 55h18M32 61h18" stroke="#1D2433" stroke-width="2" stroke-linecap="round"/>
  <text x="74" y="54" fill="#1D2433" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Backups &amp; Cloud Sync</text>
  <text x="74" y="72" fill="#5A6780" font-family="system-ui, sans-serif" font-size="11.5">Google Drive AppData &amp; portable archives</text>

  <!-- Google Drive Sync Card -->
  <rect x="20" y="94" width="340" height="278" rx="22" fill="#EDF2F8" filter="url(#neuRaised)"/>
  <rect x="36" y="112" width="36" height="36" rx="11" fill="#F5F8FC" filter="url(#neuRaisedSm)"/>
  <path d="M47 134a4.5 4.5 0 0 1 1-8.8 5 5 0 0 1 9.6 1A4 4 0 0 1 57 134z" fill="none" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="82" y="128" fill="#1D2433" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700">Google Drive Sync</text>
  <text x="82" y="143" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5">Private appDataFolder</text>

  <rect x="276" y="118" width="68" height="22" rx="10" fill="#E1E8F2"/>
  <circle cx="287" cy="129" r="3.5" fill="#22C55E"/>
  <text x="295" y="133" fill="#22C55E" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Synced</text>

  <!-- Account Recessed Well -->
  <rect x="36" y="162" width="308" height="54" rx="16" fill="#E1E8F2"/>
  <circle cx="62" cy="189" r="16" fill="#3B82F6"/>
  <text x="62" y="194" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700">JA</text>
  <text x="88" y="185" fill="#1D2433" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Jamshed Ali</text>
  <text x="88" y="201" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10">engr.jamshed.ali@gmail.com</text>
  <rect x="272" y="173" width="30" height="30" rx="10" fill="#EDF2F8"/>
  <rect x="306" y="173" width="30" height="30" rx="10" fill="#EDF2F8"/>

  <!-- Enable Toggle -->
  <text x="36" y="238" fill="#1D2433" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">Enable Google Drive Backup</text>
  <text x="36" y="253" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10">Least-privilege app folder sync active</text>
  <rect x="300" y="226" width="44" height="24" rx="12" fill="#3B82F6"/>
  <circle cx="332" cy="238" r="9" fill="#FFFFFF"/>

  <!-- Stats Wells -->
  <rect x="36" y="268" width="148" height="46" rx="13" fill="#E1E8F2"/>
  <text x="48" y="285" fill="#5A6780" font-family="system-ui, sans-serif" font-size="9.5">Last Cloud Backup</text>
  <text x="48" y="303" fill="#1D2433" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Nov 16 · 02:14 AM</text>

  <rect x="196" y="268" width="148" height="46" rx="13" fill="#E1E8F2"/>
  <text x="208" y="285" fill="#5A6780" font-family="system-ui, sans-serif" font-size="9.5">Snapshot Size</text>
  <text x="208" y="303" fill="#1D2433" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">48 KB · SHA-256</text>

  <!-- Backup Now Button -->
  <rect x="36" y="324" width="256" height="38" rx="14" fill="#3B82F6"/>
  <text x="164" y="347" fill="#FFFFFF" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Backup Now</text>
  <rect x="302" y="324" width="42" height="38" rx="14" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <path d="M316 343a7 7 0 0 1 12-4M330 343a7 7 0 0 1-12 4" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Smart Night-Time Schedule Card -->
  <rect x="20" y="388" width="340" height="170" rx="22" fill="#EDF2F8" filter="url(#neuRaised)"/>
  <rect x="36" y="404" width="34" height="34" rx="10" fill="#F5F8FC" filter="url(#neuRaisedSm)"/>
  <path d="M57 422a6 6 0 1 1-6-6 4.5 4.5 0 0 0 6 6z" fill="none" stroke="#6366F1" stroke-width="1.7"/>
  <text x="80" y="419" fill="#1D2433" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Smart Night-Time Backup</text>
  <text x="80" y="434" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10">WorkManager · 12:00 AM – 5:00 AM local</text>

  <!-- Window Pills -->
  <rect x="36" y="450" width="308" height="34" rx="12" fill="#E1E8F2"/>
  <rect x="40" y="454" width="98" height="26" rx="9" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <text x="89" y="471" fill="#3B82F6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700">12–5 AM</text>
  <text x="190" y="471" fill="#5A6780" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">10P–3A</text>
  <text x="292" y="471" fill="#5A6780" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11">2–7 AM</text>

  <text x="36" y="508" fill="#1D2433" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Wi-Fi Only · While Charging · Idle</text>
  <text x="36" y="524" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5">Auto-queues offline changes &amp; retries cleanly</text>
  <rect x="300" y="498" width="44" height="24" rx="12" fill="#3B82F6"/>
  <circle cx="332" cy="510" r="9" fill="#FFFFFF"/>

  <!-- Cloud Snapshots + Conflict-Safe Restore Preview -->
  <rect x="20" y="574" width="340" height="96" rx="22" fill="#EDF2F8" filter="url(#neuRaised)"/>
  <text x="36" y="600" fill="#1D2433" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Cloud Restore &amp; Conflict Wizard</text>
  <text x="36" y="619" fill="#22C55E" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SHA-256 Verified · Auto Pre-Restore Snapshot</text>
  <text x="36" y="638" fill="#5A6780" font-family="system-ui, sans-serif" font-size="11">Smart Merge (Cloud / Local / Both) · Keep Both · Replace</text>

  <!-- Floating Neumorphic Bottom Dock -->
  <rect x="18" y="684" width="344" height="58" rx="26" fill="#EDF2F8" filter="url(#neuRaised)"/>
  <text x="48" y="728" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5">Library</text>
  <text x="134" y="728" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5">Media</text>
  <rect x="190" y="691" width="84" height="44" rx="19" fill="#E1E8F2" stroke="#3B82F6" stroke-opacity="0.25"/>
  <text x="232" y="728" fill="#3B82F6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Backups</text>
  <text x="296" y="728" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5">Settings</text>
</svg>
