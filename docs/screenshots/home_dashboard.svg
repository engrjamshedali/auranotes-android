<svg xmlns="http://www.w3.org/2000/svg" width="380" height="760" viewBox="0 0 380 760">
  <defs>
    <filter id="neuRaised" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#C3CDD9" flood-opacity="0.75"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
    <filter id="neuRaisedSm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2.5" dy="2.5" stdDeviation="4" flood-color="#C3CDD9" flood-opacity="0.7"/>
      <feDropShadow dx="-2.5" dy="-2.5" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>
    <filter id="fabGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Soft UI Pastel Background -->
  <rect width="380" height="760" rx="30" fill="#EAEFF6" stroke="#D6DFEC" stroke-width="2.5"/>

  <!-- Top Header -->
  <rect x="20" y="34" width="44" height="44" rx="14" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <path d="M33 49h18M33 56h18M33 63h18" stroke="#1D2433" stroke-width="2" stroke-linecap="round"/>

  <text x="76" y="54" fill="#1D2433" font-family="system-ui, sans-serif" font-size="22" font-weight="700">AuraNotes</text>

  <!-- Live Cloud Sync Status Pill -->
  <rect x="190" y="37" width="70" height="22" rx="10" fill="#E1E8F2" stroke="#D6DFEC" stroke-width="1"/>
  <circle cx="201" cy="48" r="3.5" fill="#22C55E"/>
  <text x="209" y="52" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Synced</text>

  <text x="76" y="72" fill="#5A6780" font-family="system-ui, sans-serif" font-size="12">6 notes</text>

  <!-- Single Clean Layout Toggle Button (No Cluttered Command Icon) -->
  <rect x="316" y="34" width="44" height="44" rx="14" fill="#EDF2F8" filter="url(#neuRaisedSm)"/>
  <rect x="328" y="46" width="8" height="8" rx="2" fill="none" stroke="#1D2433" stroke-width="1.8"/>
  <rect x="340" y="46" width="8" height="8" rx="2" fill="none" stroke="#1D2433" stroke-width="1.8"/>
  <rect x="328" y="58" width="8" height="8" rx="2" fill="none" stroke="#1D2433" stroke-width="1.8"/>
  <rect x="340" y="58" width="8" height="8" rx="2" fill="none" stroke="#1D2433" stroke-width="1.8"/>

  <!-- Recessed Search Well -->
  <rect x="20" y="94" width="340" height="44" rx="15" fill="#E1E8F2" stroke="#D6DFEC" stroke-width="1.2"/>
  <circle cx="40" cy="116" r="6" fill="none" stroke="#3B82F6" stroke-width="1.8"/>
  <line x1="45" y1="121" x2="49" y2="125" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/>
  <text x="58" y="120" fill="#8895AC" font-family="system-ui, sans-serif" font-size="13">Search notes, code, or tags...</text>

  <!-- Note Card 1 (Pinned, Raised Soft UI) -->
  <rect x="20" y="156" width="340" height="148" rx="22" fill="#EDF2F8" stroke="#6366F1" stroke-opacity="0.35" stroke-width="1.2" filter="url(#neuRaised)"/>
  <rect x="36" y="172" width="82" height="22" rx="9" fill="#E1E8F2"/>
  <circle cx="46" cy="183" r="3.5" fill="#6366F1"/>
  <text x="55" y="187" fill="#6366F1" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Personal</text>
  <!-- Pin & Heart Lucide Indicators -->
  <path d="M300 177v6m-3-2h6" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M324 185l-4.5-4.3a2.6 2.6 0 0 1 3.7-3.7l.8.8.8-.8a2.6 2.6 0 0 1 3.7 3.7z" fill="none" stroke="#F43F5E" stroke-width="1.6"/>
  <circle cx="342" cy="181" r="1.2" fill="#5A6780"/><circle cx="346" cy="181" r="1.2" fill="#5A6780"/>

  <text x="36" y="216" fill="#1D2433" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Project Architecture v2.0</text>
  <text x="36" y="238" fill="#5A6780" font-family="system-ui, sans-serif" font-size="12.5">Local Room vault with debounced auto-save &amp;</text>
  <text x="36" y="256" fill="#5A6780" font-family="system-ui, sans-serif" font-size="12.5">night-time Google Drive AppData sync.</text>
  <text x="36" y="286" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">#architecture #cloud #softui</text>
  <text x="274" y="286" fill="#8895AC" font-family="system-ui, sans-serif" font-size="10.5">Nov 16 · 10:15</text>

  <!-- Note Card 2 (Code Studio Note) -->
  <rect x="20" y="320" width="340" height="148" rx="22" fill="#EDF2F8" filter="url(#neuRaised)"/>
  <rect x="36" y="336" width="96" height="22" rx="9" fill="#E1E8F2"/>
  <circle cx="46" cy="347" r="3.5" fill="#3B82F6"/>
  <text x="55" y="351" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Programming</text>
  <rect x="138" y="336" width="60" height="22" rx="9" fill="#E1E8F2"/>
  <text x="148" y="351" fill="#6366F1" font-family="monospace" font-size="10" font-weight="700">PYTHON</text>

  <text x="36" y="380" fill="#1D2433" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Analytics Engine.py</text>
  <text x="36" y="402" fill="#5A6780" font-family="monospace" font-size="11.5">def compute_sync_delta(notes):</text>
  <text x="36" y="420" fill="#5A6780" font-family="monospace" font-size="11.5">    return [n for n in notes if n.dirty]</text>
  <text x="36" y="450" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">#python #analytics #studio</text>
  <text x="274" y="450" fill="#8895AC" font-family="system-ui, sans-serif" font-size="10.5">Nov 16 · 09:40</text>

  <!-- Note Card 3 (Checklist Note) -->
  <rect x="20" y="484" width="340" height="132" rx="22" fill="#EDF2F8" filter="url(#neuRaised)"/>
  <rect x="36" y="500" width="76" height="22" rx="9" fill="#E1E8F2"/>
  <circle cx="46" cy="511" r="3.5" fill="#10B981"/>
  <text x="55" y="515" fill="#10B981" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Ideas</text>
  <rect x="118" y="500" width="76" height="22" rx="9" fill="#E1E8F2"/>
  <text x="128" y="515" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="10" font-weight="700">CHECKLIST</text>

  <text x="36" y="544" fill="#1D2433" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Release Checklist</text>
  <text x="36" y="566" fill="#5A6780" font-family="system-ui, sans-serif" font-size="12.5">[x] Drive AppData OAuth 2.0 &amp; WorkManager</text>
  <text x="36" y="596" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="11" font-weight="600">#release #tasks</text>
  <text x="274" y="596" fill="#8895AC" font-family="system-ui, sans-serif" font-size="10.5">Nov 15 · 21:10</text>

  <!-- Floating Accent FAB -->
  <circle cx="326" cy="634" r="28" fill="#3B82F6" filter="url(#fabGlow)"/>
  <path d="M316 634h20M326 624v20" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Floating Neumorphic Bottom Dock -->
  <rect x="18" y="684" width="344" height="58" rx="26" fill="#EDF2F8" filter="url(#neuRaised)"/>
  <!-- Active Recessed Pill: Library -->
  <rect x="26" y="691" width="80" height="44" rx="19" fill="#E1E8F2" stroke="#3B82F6" stroke-opacity="0.25"/>
  <path d="M58 703h6l2 2h8v10H58z" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="48" y="728" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Library</text>

  <!-- Media -->
  <rect x="142" y="702" width="14" height="12" rx="2" fill="none" stroke="#5A6780" stroke-width="1.8"/>
  <text x="134" y="728" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500">Media</text>

  <!-- Backups -->
  <path d="M225 714a5 5 0 0 1 1-9.8 5.5 5.5 0 0 1 10.6 1A4.5 4.5 0 0 1 236 714z" fill="none" stroke="#5A6780" stroke-width="1.8"/>
  <text x="211" y="728" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500">Backups</text>

  <!-- Settings -->
  <circle cx="316" cy="708" r="5" fill="none" stroke="#5A6780" stroke-width="1.8"/>
  <text x="296" y="728" fill="#5A6780" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500">Settings</text>
</svg>
